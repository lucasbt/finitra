name: Bump version, tag and release on PR merge
on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  release:
    if: >
      github.event.pull_request.merged == true &&
      !contains(github.event.pull_request.labels.*.name, 'skip-release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Compute new version from branch name
        id: bump
        run: |
          CURRENT=$(cat version)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          BRANCH="${{ github.event.pull_request.head.ref }}"
          echo "Source branch: $BRANCH"

          # Extra protection: reserved/protected branches should never
          # reach this point (they are blocked by the validation workflow),
          # but we fail loudly here as a safety net instead of silently
          # bumping the version.
          if [[ "$BRANCH" == "main" || "$BRANCH" == "master" || "$BRANCH" == "develop" || "$BRANCH" =~ ^release/ ]]; then
            echo "❌ '$BRANCH' is a reserved branch name and should never trigger a release."
            exit 1
          fi

          if [[ "$BRANCH" =~ ^(major|breaking)/ ]]; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif [[ "$BRANCH" =~ ^(feature|feat)/ ]]; then
            MINOR=$((MINOR + 1)); PATCH=0
          elif [[ "$BRANCH" =~ ^(fix|bugfix|hotfix|chore)/ ]]; then
            PATCH=$((PATCH + 1))
          else
            echo "❌ Branch name '$BRANCH' does not match any known convention."
            echo "This should not happen if the validation workflow is enabled and required."
            exit 1
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          # Extra protection: avoid creating a duplicate tag/release if this
          # exact version was already produced before (idempotency guard).
          if git rev-parse "v${NEW_VERSION}" >/dev/null 2>&1; then
            echo "❌ Tag v${NEW_VERSION} already exists. Aborting to avoid overwriting an existing release."
            exit 1
          fi

          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update version file and commit to main
        run: |
          echo "${{ steps.bump.outputs.new_version }}" > version
          git add version
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}"
          git push origin main

      - name: Create tag on the new commit
        run: |
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin "v${{ steps.bump.outputs.new_version }}"

      - name: Create release from the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.bump.outputs.new_version }}" \
            --title "v${{ steps.bump.outputs.new_version }}" \
            --generate-notes
