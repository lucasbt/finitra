name: Bump Version on PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          # Check out the PR's source branch, not main
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Calculate New Version by Branch
        id: bump_version
        run: |
          # 1. Fetch current version straight from main branch to avoid accumulating incorrect bumps
          git fetch origin main
          CURRENT_VERSION=$(git show origin/main:version 2>/dev/null || echo "1.0.0")
          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
          
          # 2. Get the PR's source branch name
          SOURCE_BRANCH="${{ github.event.pull_request.head.ref }}"
          echo "Source branch: $SOURCE_BRANCH"
          
          # 3. Decide the increment
          if [[ "$SOURCE_BRANCH" =~ ^(major|release)/ ]]; then
            major=$((major + 1))
            minor=0
            patch=0
          elif [[ "$SOURCE_BRANCH" =~ ^(feature|feat|minor)/ ]]; then
            minor=$((minor + 1))
            patch=0
          elif [[ "$SOURCE_BRANCH" =~ ^(docs|documentation)/ ]]; then
            echo "Documentation change only. Skipping update."
            exit 0
          else
            patch=$((patch + 1))
          fi
          
          NEW_VERSION="$major.$minor.$patch"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Update and Commit File to PR
        run: |
          if [ -z "${{ env.NEW_VERSION }}" ]; then
            echo "No version to update."
            exit 0
          fi
          
          echo "${{ env.NEW_VERSION }}" > version
          
          # Verify if the file actually changed before committing (prevents loops)
          if ! git diff --exit-code version; then
            git add version
            git commit -m "chore(version): bump version to ${{ env.NEW_VERSION }} [skip ci]"
            git push origin ${{ github.event.pull_request.head.ref }}
          else
            echo "The version file is already up to date."
          fi