name: Automated Release

on:
  pull_request:
    branches:
      - main
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Updated Version
        run: |
          # The branch has already been merged, so the correct version is already in the file
          VERSION=$(cat version)
          echo "NEW_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Creating release for version: v$VERSION"

      - name: Create Tag and Release on GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # If it's a documentation branch, we can skip creating the release
          SOURCE_BRANCH="${{ github.event.pull_request.head.ref }}"
          if [[ "$SOURCE_BRANCH" =~ ^(docs|documentation)/ ]]; then
            echo "Documentation PR detected. Skipping Tag/Release creation."
            exit 0
          fi

          TAG="v${{ env.NEW_VERSION }}"
          
          # 1. Create custom header with PR details
          echo "## 🚀 What's New in $TAG" > release_notes.md
          echo "" >> release_notes.md
          echo "**Source Branch:** \`${{ github.event.pull_request.head.ref }}\`" >> release_notes.md
          echo "**PR Author:** @${{ github.event.pull_request.user.login }}" >> release_notes.md
          echo "**Original Description:**" >> release_notes.md
          echo "> ${{ github.event.pull_request.title }}" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          
          # 2. Create the Official Release appending auto-generated notes
          gh release create "$TAG" \
            --title "🚀 Release $TAG" \
            --notes-file release_notes.md \
            --generate-notes \
            --target main